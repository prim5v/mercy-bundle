<g font-family="Arial,sans-serif"><g transform="translate(55 65)"><rect width="330" height="270" rx="20" fill="#1b3446" stroke="#6bbce0" stroke-width="2"/><circle cx="165" cy="85" r="42" fill="#244b62"/><path d="M143 90h44M165 68v44" stroke="#bde8fb" stroke-width="6" stroke-linecap="round"/><text x="165" y="165" text-anchor="middle" fill="#eaf4fa" font-size="27" font-weight="700">Consumer</text><text x="165" y="205" text-anchor="middle" fill="#b5c8d4" font-size="17">Needs a route to the internet</text><text x="165" y="235" text-anchor="middle" fill="#b5c8d4" font-size="17">Uses connectivity</text></g>
<g transform="translate(435 65)"><rect width="330" height="270" rx="20" fill="#1b3b37" stroke="#65d9a6" stroke-width="2"/><circle cx="165" cy="85" r="42" fill="#24564a"/><path d="M137 85h56M165 57v56M145 65l40 40M185 65l-40 40" stroke="#b5f3d2" stroke-width="5" stroke-linecap="round"/><text x="165" y="165" text-anchor="middle" fill="#eaf8f1" font-size="27" font-weight="700">Relay</text><text x="165" y="205" text-anchor="middle" fill="#b9d8ca" font-size="17">Forwards traffic between peers</text><text x="165" y="235" text-anchor="middle" fill="#b9d8ca" font-size="17">May not have internet</text></g>
<g transform="translate(815 65)"><rect width="330" height="270" rx="20" fill="#3b3020" stroke="#e9bb70" stroke-width="2"/><circle cx="165" cy="85" r="42" fill="#604728"/><path d="M135 88q30-40 60 0M145 105q20-25 40 0M165 118v2" fill="none" stroke="#ffe0a6" stroke-width="5" stroke-linecap="round"/><text x="165" y="165" text-anchor="middle" fill="#fff5e6" font-size="27" font-weight="700">Provider</text><text x="165" y="205" text-anchor="middle" fill="#dfc9a6" font-size="17">Shares an internet gateway</text><text x="165" y="235" text-anchor="middle" fill="#dfc9a6" font-size="17">Cellular or permitted Wi-Fi</text></g></g>
<text x="600" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#a9bfcc">Roles are separate capabilities. A participant chooses which ones to enable.</text></svg>